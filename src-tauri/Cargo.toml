[package]
name = "zoid"
version = "0.25.0"
description = "Zoid 25 clean macOS desktop scaffold"
authors = ["Ziad Salah"]
edition = "2021"

[lib]
name = "zoid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
wait-timeout = "0.2"
